<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #2b294d,
                #5f4bb6
            );

            font-family: Arial, sans-serif;
        }

        .container {

            background-color: white;

            padding: 40px;

            border-radius: 20px;

            width: 400px;

            text-align: center;

            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2b294d;
            margin-bottom: 25px;
        }

        input {

            width: 90%;

            padding: 12px;

            border-radius: 10px;

            border: 2px solid #d0c9ff;

            margin-bottom: 20px;

            font-size: 16px;
        }

        button {

            background-color: #5f4bb6;

            color: white;

            border: none;

            padding: 12px 25px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;

            transition: 0.3s;
        }

        button:hover {
            background-color: #46358f;
        }

        #result {

            margin-top: 25px;

            font-size: 18px;

            word-wrap: break-word;
        }

        a {
            color: #5f4bb6;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Acortador de URLs</h1>

        <input
            type="text"
            id="urlInput"
            placeholder="https://google.com"
        >

        <br>

        <button onclick="shortenUrl()">
            Acortar URL
        </button>

        <div id="result"></div>

    </div>

    <script>

        const API_URL = "http://54.89.153.4:8000";

        async function shortenUrl() {

            const url =
                document.getElementById("urlInput").value;

            const response = await fetch(`${API_URL}/shorten`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    url: url
                })
            });

            const data = await response.json();

            document.getElementById("result").innerHTML =
                `
                <p>Tu URL acortada:</p>

                <a href="${data.short_url}" target="_blank">
                    ${data.short_url}
                </a>
                `;
        }

    </script>

</body>
</html>
